<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Surfers — CV GAMES</title>
  <link rel="icon" href="img/incon.png" type="image/png">
  <script>
    try { const savedTheme = localStorage.getItem('cv-games-theme'); if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme; } catch {}
    window.NOSW = true;
    window.GAME_CONFIG = { pokiSdkDebug: false, leaderboard: 'mockup', bundlesPath: './bundles' };
    delete Array.prototype.group;
  </script>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/game-page.css">
  <script src="data/jogos.js" defer></script>
  <script src="js/game-page.js" defer></script>
</head>
<body class="game-page" data-game-id="subway-surfers">
  <a class="skip-link" href="#jogar">Pular para o jogo</a>
  <header id="game-page-header"></header>
  <main class="container game-main">
    <div id="game-intro"></div>
    <section class="game-section" id="jogar" aria-labelledby="jogar-title">
      <div class="game-section-heading"><h2 id="jogar-title">🎮 Jogar</h2><p>O jogo é carregado na área abaixo.</p></div>
      <div class="game-stage"><div class="game-loader" data-game-loading><span class="loader-ring" aria-hidden="true"></span><span>Carregando jogo...</span></div><iframe id="jogo-frame" data-game-iframe src="https://ug17.github.io/play/Subway-Surfers/" title="Subway Surfers" allowfullscreen></iframe></div>
      <div class="game-stage-tools"><button type="button" data-game-fullscreen>⛶ Tela cheia</button></div>
    </section>
    <div id="game-details"></div>
  </main>
  <footer id="game-page-footer"></footer>
</body>
</html>
